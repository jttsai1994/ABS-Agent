<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FIT 知識庫問答</title>
<style>
/* ── Theme tokens ────────────────────────────────────────────── */
:root {
  --bg: #f0f2f5;
  --fg: #1a1a1a;
  --panel: #ffffff;
  --panel-soft: #f9fafb;
  --border: #e5e7eb;
  --muted: #6b7280;
  --muted-2: #9ca3af;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-soft: #dbeafe;
  --sidebar-bg: #1c2333;
  --sidebar-fg: #cdd5e0;
  --sidebar-head: #151c2c;
  --sidebar-item-hover: #253048;
  --user-bubble: #2563eb;
  --user-bubble-fg: #ffffff;
  --ai-bubble: #ffffff;
  --code-bg: #1e293b;
  --code-fg: #e2e8f0;
  --inline-code-bg: #f1f5f9;
  --shadow: 0 1px 3px rgba(0,0,0,.06);
  --highlight: #fff3a3;
}
html[data-theme="dark"] {
  --bg: #0f172a;
  --fg: #e2e8f0;
  --panel: #1e293b;
  --panel-soft: #172033;
  --border: #334155;
  --muted: #94a3b8;
  --muted-2: #64748b;
  --accent: #60a5fa;
  --accent-hover: #3b82f6;
  --accent-soft: #1e3a5f;
  --sidebar-bg: #0b1220;
  --sidebar-fg: #cbd5e1;
  --sidebar-head: #060a14;
  --sidebar-item-hover: #1e2a44;
  --user-bubble: #3b82f6;
  --user-bubble-fg: #ffffff;
  --ai-bubble: #1e293b;
  --code-bg: #020617;
  --code-fg: #e2e8f0;
  --inline-code-bg: #0f172a;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
  --highlight: #854d0e;
}

/* ── Reset & base ────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--fg); font-size: 14px; transition: background .2s, color .2s; }

/* ── Layout ──────────────────────────────────────────────────── */
#app { display: flex; height: 100vh; overflow: hidden; }

/* ── Sidebar ─────────────────────────────────────────────────── */
#sidebar {
  width: 18%; background: var(--sidebar-bg); color: var(--sidebar-fg);
  display: flex; flex-direction: column; overflow: hidden;
  position: relative; min-width: 220px;
}
#sidebar-resize {
  position: absolute; right: 0; top: 0; height: 100%;
  width: 5px; cursor: col-resize; background: transparent; z-index: 10;
}
#sidebar-resize:hover { background: #2563eb66; }
#sidebar-header {
  padding: 18px 16px 12px; background: var(--sidebar-head);
  display: flex; align-items: center; gap: 10px;
}
#sidebar-header .logo { font-size: 20px; }
#sidebar-header h1 { font-size: 15px; font-weight: 700; color: #e8edf5; }
#btn-new {
  margin: 10px 12px; padding: 9px 14px;
  background: var(--accent); color: #fff; border: none; border-radius: 8px;
  font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px;
  font-weight: 600;
}
#btn-new:hover { background: var(--accent-hover); }
#sess-search-wrap { padding: 0 12px 6px; }
#sess-search {
  width: 100%; padding: 7px 10px; border-radius: 6px;
  background: #0f172a; color: #e2e8f0; border: 1px solid #2a3553;
  font-size: 12px; outline: none;
}
#sess-search:focus { border-color: var(--accent); }
#sessions-label { padding: 6px 16px 4px; font-size: 11px; color: #6b7a99; text-transform: uppercase; letter-spacing: .05em; }
#session-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.sess-item {
  padding: 9px 10px; border-radius: 7px; cursor: pointer;
  margin-bottom: 2px; border: 1px solid transparent;
}
.sess-item:hover { background: var(--sidebar-item-hover); }
.sess-item.active { background: #2563eb22; border-color: #2563eb66; }
.sess-first { font-size: 13px; color: #d0d8e8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sess-meta { font-size: 11px; color: #6b7a99; margin-top: 2px; }
.sess-snippet { font-size: 11px; color: #93a3b8; margin-top: 2px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; }
.sess-btn {
  background: none; border: none; color: #6b7a99; cursor: pointer;
  font-size: 12px; padding: 2px 6px; border-radius: 4px;
}
.sess-btn:hover { background: #2563eb44; color: #e8edf5; }

/* ── Main area ───────────────────────────────────────────────── */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

#topbar {
  background: var(--panel); border-bottom: 1px solid var(--border);
  padding: 12px 20px; display: flex; align-items: center; gap: 8px;
  box-shadow: var(--shadow);
}
#topbar h2 { flex: 1; font-size: 15px; font-weight: 700; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-btn {
  padding: 5px 10px; background: var(--panel-soft); border: 1px solid var(--border);
  border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--muted);
  display: inline-flex; align-items: center; gap: 4px;
}
.top-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
#btn-clear:hover { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }
html[data-theme="dark"] #btn-clear:hover { background: #7f1d1d; border-color: #b91c1c; color: #fecaca; }

.menu-wrap { position: relative; }
.menu-pop {
  display: none; position: absolute; right: 0; top: calc(100% + 4px);
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,.12); min-width: 180px; z-index: 50; overflow: hidden;
}
.menu-pop.open { display: block; }
.menu-pop button {
  display: block; width: 100%; text-align: left; padding: 9px 14px;
  background: none; border: none; cursor: pointer; font-size: 13px; color: var(--fg);
}
.menu-pop button:hover { background: var(--accent-soft); color: var(--accent); }

/* ── Filter bar ──────────────────────────────────────────────── */
#filter-bar {
  background: var(--panel-soft); border-bottom: 1px solid var(--border);
  padding: 8px 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
}
#filter-bar label { font-size: 12px; color: var(--muted); }
#filter-bar input, #filter-bar select {
  padding: 4px 8px; border: 1px solid var(--border); border-radius: 5px;
  font-size: 12px; background: var(--panel); color: var(--fg); outline: none;
}
#filter-bar input:focus, #filter-bar select:focus { border-color: var(--accent); }
#filter-cat { width: 160px; }
#filter-from, #filter-to { width: 100px; }

/* ── Messages ────────────────────────────────────────────────── */
#messages {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 16px;
}
.msg-wrap { display: flex; gap: 10px; align-items: flex-start; max-width: 100%; }
.msg-wrap.user  { flex-direction: row-reverse; }
.msg-body { display: flex; flex-direction: column; max-width: 75%; }
.msg-wrap.user .msg-body { align-items: flex-end; }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700;
}
.avatar.ai   { background: var(--accent-soft); color: var(--accent-hover); }
.avatar.user { background: #d1fae5; color: #065f46; }
.bubble {
  padding: 12px 16px; border-radius: 14px;
  line-height: 1.6; word-break: break-word; white-space: pre-wrap;
  font-size: 14px;
}
.msg-wrap.ai   .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-top-left-radius: 4px; box-shadow: var(--shadow); }
.msg-wrap.user .bubble { background: var(--user-bubble); color: var(--user-bubble-fg); border-top-right-radius: 4px; }
.msg-meta { display: flex; gap: 10px; align-items: center; margin-top: 4px; font-size: 10.5px; color: var(--muted-2); }
.msg-wrap.user .msg-meta { justify-content: flex-end; }
.msg-actions { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
.msg-wrap:hover .msg-actions { opacity: 1; }
.msg-action {
  background: none; border: none; cursor: pointer; padding: 3px 6px; border-radius: 4px;
  font-size: 12px; color: var(--muted); line-height: 1;
}
.msg-action:hover { background: var(--accent-soft); color: var(--accent); }
.msg-action.active-up { color: #059669; background: #d1fae5; }
.msg-action.active-down { color: #dc2626; background: #fee2e2; }
.msg-stats { color: var(--muted-2); font-size: 10.5px; }

/* highlight in sources */
mark.hl { background: var(--highlight); color: inherit; padding: 0 2px; border-radius: 2px; }

/* sources */
.sources-toggle {
  margin-top: 8px; font-size: 12px; color: var(--accent); cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px; user-select: none;
}
.sources-toggle:hover { text-decoration: underline; }
.sources-list { display: none; margin-top: 6px; padding: 8px 10px; background: var(--panel-soft); border-radius: 7px; border: 1px solid var(--border); }
.sources-list.open { display: block; }
.source-item {
  font-size: 12px; color: var(--fg); padding: 6px 8px; border-bottom: 1px solid var(--border);
  cursor: pointer; border-radius: 4px;
}
.source-item:hover { background: var(--accent-soft); }
.source-item:last-child { border-bottom: none; }
.source-item strong { color: var(--accent-hover); }
.source-item .src-hint { color: var(--muted-2); font-size: 11px; margin-left: 4px; }

/* document modal & generic modal */
.modal-backdrop {
  display: none; position: fixed; inset: 0; background: rgba(15,23,42,.55);
  z-index: 200; align-items: center; justify-content: center; padding: 24px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--panel); max-width: 820px; width: 100%; max-height: 88vh;
  border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
  display: flex; flex-direction: column; overflow: hidden;
}
.modal-header {
  padding: 14px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--panel-soft);
}
.modal-title { font-size: 15px; font-weight: 700; color: var(--fg); flex: 1; line-height: 1.4; }
.modal-close {
  background: none; border: none; cursor: pointer; font-size: 22px; color: var(--muted);
  padding: 0 6px; line-height: 1; border-radius: 6px;
}
.modal-close:hover { background: var(--border); color: var(--fg); }
#doc-modal-meta {
  padding: 10px 20px; font-size: 12px; color: var(--muted);
  background: var(--panel-soft); border-bottom: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 14px;
}
#doc-modal-meta .meta-label { color: var(--muted-2); }
#doc-modal-body {
  padding: 18px 20px; overflow-y: auto; flex: 1;
  font-size: 13.5px; line-height: 1.7; color: var(--fg);
  white-space: pre-wrap; word-break: break-word;
}
#doc-modal-keywords {
  padding: 10px 20px; border-top: 1px solid var(--border); background: var(--panel-soft);
  display: flex; flex-wrap: wrap; gap: 6px;
}
#doc-modal-keywords .kw {
  font-size: 11px; padding: 2px 8px; background: var(--accent-soft); color: var(--accent-hover);
  border-radius: 10px;
}
#doc-modal-loading, #doc-modal-error { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 14px; }
#doc-modal-error { color: #dc2626; }

/* shortcuts modal */
#shortcuts-body { padding: 16px 22px; overflow-y: auto; flex: 1; }
#shortcuts-body table { width: 100%; border-collapse: collapse; font-size: 13px; }
#shortcuts-body td { padding: 8px 6px; border-bottom: 1px solid var(--border); }
#shortcuts-body kbd {
  background: var(--panel-soft); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 7px; font-family: "Consolas", monospace; font-size: 12px;
}

/* typing */
.typing-dot {
  display: inline-flex; gap: 4px; align-items: center; padding: 8px 12px;
  background: var(--ai-bubble); border: 1px solid var(--border); border-radius: 12px; border-top-left-radius: 4px;
}
.typing-dot span {
  width: 7px; height: 7px; background: #93c5fd; border-radius: 50%;
  animation: bounce 1.2s infinite ease-in-out;
}
.typing-dot span:nth-child(2) { animation-delay: .2s; }
.typing-dot span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

/* empty state */
#empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--muted-2); gap: 10px;
}
#empty-state .icon { font-size: 48px; opacity: .4; }
#empty-state p { font-size: 15px; }

/* error retry banner */
.err-banner {
  background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b;
  padding: 10px 14px; border-radius: 10px; display: flex; align-items: center; gap: 10px;
  font-size: 13px;
}
.err-content { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.err-command {
  display: block; width: fit-content; max-width: 100%; overflow-x: auto;
  padding: 4px 7px; border-radius: 4px; background: rgba(255,255,255,.65);
  font-family: "Consolas", monospace; user-select: all;
}
.err-login-link { color: inherit; font-weight: 700; text-decoration: underline; }
html[data-theme="dark"] .err-banner { background: #450a0a; border-color: #b91c1c; color: #fecaca; }
.err-banner button {
  margin-left: auto; background: #b91c1c; color: #fff; border: none;
  padding: 4px 12px; border-radius: 5px; cursor: pointer; font-size: 12px;
}

/* ── Input area ──────────────────────────────────────────────── */
#input-area {
  background: var(--panel); border-top: 1px solid var(--border);
  padding: 16px 20px; display: flex; gap: 10px; align-items: flex-end;
}
#input-wrap { flex: 1; position: relative; }
#user-input {
  width: 100%; padding: 12px 16px; border: 1.5px solid var(--border);
  border-radius: 10px; font-size: 14px; font-family: inherit;
  resize: none; outline: none; max-height: 200px; overflow-y: auto;
  background: var(--panel); color: var(--fg); line-height: 1.65;
}
#user-input:focus { border-color: var(--accent); }
#btn-send {
  width: 42px; height: 42px; background: var(--accent); border: none;
  border-radius: 10px; cursor: pointer; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0;
}
#btn-send:hover { background: var(--accent-hover); }
#btn-send svg { fill: #fff; width: 18px; height: 18px; }
#btn-send.stop { background: #dc2626; }
#btn-send.stop:hover { background: #991b1b; }
#char-hint { font-size: 11px; color: var(--muted-2); margin-top: 4px; text-align: right; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
html[data-theme="dark"] ::-webkit-scrollbar-thumb { background: #475569; }

/* ── Markdown rendered content ──────────────────────────────── */
.bubble.md h1,.bubble.md h2,.bubble.md h3 { font-weight: 700; margin: .6em 0 .3em; line-height: 1.3; }
.bubble.md h1 { font-size: 17px; }
.bubble.md h2 { font-size: 15px; }
.bubble.md h3 { font-size: 14px; color: var(--accent); }
.bubble.md p  { margin: .4em 0; }
.bubble.md ul,.bubble.md ol { padding-left: 1.4em; margin: .4em 0; }
.bubble.md li { margin: .2em 0; }
.bubble.md strong { font-weight: 700; }
.bubble.md em { font-style: italic; color: var(--muted); }
.bubble.md code {
  background: var(--inline-code-bg); border: 1px solid var(--border);
  border-radius: 3px; padding: 1px 5px; font-size: 12px;
  font-family: "Consolas", monospace;
}
.bubble.md pre {
  background: var(--code-bg); color: var(--code-fg);
  border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: .5em 0;
  position: relative;
}
.bubble.md pre code { background: none; border: none; color: inherit; padding: 0; font-size: 12px; }
.bubble.md blockquote { border-left: 3px solid #93c5fd; padding-left: 10px; color: var(--muted); margin: .4em 0; }
.bubble.md hr { border: none; border-top: 1px solid var(--border); margin: .6em 0; }
.bubble.md table { border-collapse: collapse; width: 100%; margin: .5em 0; font-size: 13px; }
.bubble.md th,.bubble.md td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
.bubble.md th { background: var(--panel-soft); font-weight: 700; }
.bubble.md a { color: var(--accent); text-decoration: underline; }

/* code copy button */
.code-copy-btn {
  position: absolute; top: 6px; right: 6px;
  background: rgba(255,255,255,.1); color: #cbd5e1; border: 1px solid rgba(255,255,255,.15);
  border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer;
  opacity: 0; transition: opacity .15s;
}
.bubble.md pre:hover .code-copy-btn { opacity: 1; }
.code-copy-btn:hover { background: rgba(255,255,255,.2); }

/* toast */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #111827; color: #fff; padding: 8px 18px; border-radius: 8px;
  font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s;
  z-index: 999;
}
#toast.show { opacity: .95; }

/* mobile */
#btn-toggle-sidebar { display: none; background: none; border: none; cursor: pointer; padding: 4px; }
#btn-toggle-sidebar svg { width: 22px; height: 22px; fill: var(--muted); }
@media (max-width: 640px) {
  #sidebar { width: 0 !important; min-width: 0; }
  #sidebar.open { width: 75vw !important; min-width: 75vw; position: absolute; z-index: 99; height: 100%; }
  #btn-toggle-sidebar { display: flex !important; }
}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/atom-one-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div id="sidebar-resize"></div>
    <div id="sidebar-header">
      <span class="logo">🏭</span>
      <h1>FIT 知識庫</h1>
    </div>
    <button id="btn-new">
      <svg viewBox="0 0 20 20" width="14" height="14" fill="currentColor"><path d="M10 2a1 1 0 011 1v6h6a1 1 0 110 2h-6v6a1 1 0 11-2 0v-6H3a1 1 0 110-2h6V3a1 1 0 011-1z"/></svg>
      新對話
    </button>
    <div id="sess-search-wrap">
      <input id="sess-search" type="search" placeholder="🔍 搜尋對話內容…" />
    </div>
    <div id="sessions-label">對話記錄</div>
    <div id="session-list"></div>
  </aside>

  <div id="main">
    <div id="topbar">
      <button id="btn-toggle-sidebar" onclick="document.getElementById('sidebar').classList.toggle('open')">
        <svg viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h18"/></svg>
      </button>
      <h2 id="topbar-title">新對話</h2>
      <button class="top-btn" id="btn-theme" title="切換主題 (Ctrl+Shift+L)">🌙</button>
      <div class="menu-wrap">
        <button class="top-btn" id="btn-export">⤓ 匯出</button>
        <div class="menu-pop" id="export-menu">
          <button data-fmt="md">匯出 Markdown</button>
          <button data-fmt="json">匯出 JSON</button>
        </div>
      </div>
      <button class="top-btn" id="btn-help" title="鍵盤快捷鍵 (?)">⌨</button>
      <button class="top-btn" id="btn-clear">清除記錄</button>
    </div>

    <div id="filter-bar">
      <label>分類篩選</label>
      <input id="filter-cat" type="text" placeholder="例：FIT > Lab" />
      <label>日期起</label>
      <input id="filter-from" type="text" placeholder="202401" maxlength="10" />
      <label>日期迄</label>
      <input id="filter-to" type="text" placeholder="202412" maxlength="10" />
      <label>筆數</label>
      <select id="filter-topk">
        <option value="3">3</option>
        <option value="5" selected>5</option>
        <option value="10">10</option>
        <option value="20">20</option>
      </select>
    </div>

    <div id="messages">
      <div id="empty-state">
        <div class="icon">💬</div>
        <p>請輸入問題開始查詢 FIT 內部知識庫</p>
      </div>
    </div>

    <div id="input-area">
      <div id="input-wrap">
        <textarea id="user-input" rows="2" placeholder="輸入問題…（Enter 送出，Shift+Enter 換行，? 看快捷鍵）"></textarea>
        <div id="char-hint"></div>
      </div>
      <button id="btn-send" title="送出">
        <svg id="send-icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        <svg id="stop-icon" viewBox="0 0 24 24" style="display:none"><path d="M6 6h12v12H6z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Document modal -->
<div id="doc-modal-backdrop" class="modal-backdrop" onclick="if(event.target===this)closeDocModal()">
  <div class="modal">
    <div class="modal-header">
      <div id="doc-modal-title" class="modal-title">載入中…</div>
      <button class="modal-close" onclick="closeDocModal()">×</button>
    </div>
    <div id="doc-modal-meta"></div>
    <div id="doc-modal-body"></div>
    <div id="doc-modal-keywords"></div>
  </div>
</div>

<!-- Shortcuts modal -->
<div id="help-modal-backdrop" class="modal-backdrop" onclick="if(event.target===this)closeHelp()">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <div class="modal-title">鍵盤快捷鍵</div>
      <button class="modal-close" onclick="closeHelp()">×</button>
    </div>
    <div id="shortcuts-body">
      <table>
        <tr><td><kbd>Enter</kbd></td><td>送出訊息</td></tr>
        <tr><td><kbd>Shift</kbd> + <kbd>Enter</kbd></td><td>換行</td></tr>
        <tr><td><kbd>Ctrl</kbd> + <kbd>/</kbd></td><td>建立新對話</td></tr>
        <tr><td><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>L</kbd></td><td>切換深色 / 淺色主題</td></tr>
        <tr><td><kbd>Esc</kbd></td><td>關閉視窗 / 停止生成</td></tr>
        <tr><td><kbd>?</kbd></td><td>開啟此說明 (輸入框外)</td></tr>
      </table>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let sessionId = null;
let isLoading = false;
let abortCtl = null;
let lastSendPayload = null;   // for retry
let lastUserMsgText = null;   // for regenerate
let titledThisSession = false;

// ── Theme ──────────────────────────────────────────────────────────────────
(function initTheme() {
  const saved = localStorage.getItem('fit_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
})();
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('fit_theme', next);
  document.getElementById('btn-theme').textContent = next === 'dark' ? '☀' : '🌙';
}
document.getElementById('btn-theme').textContent =
  (localStorage.getItem('fit_theme') === 'dark') ? '☀' : '🌙';

// ── Query classification ───────────────────────────────────────────────────
function shouldUseRAG(message) {
  const msg = message.toLowerCase().trim();
  if (/^(hi|hello|你好|嗨|哈囉|早|晚|晚安|早安|hey)[\s,。?！!]*$/.test(msg)) return false;
  if (/^(how|怎麼|如何|怎樣|help|幫助|指引|說明|用法|使用方法|tutorial|guide|教)/.test(msg)) return false;
  if (/^(who are you|你是誰|你叫什麼|你是|what are you|你的名字|about you|tell me about)/.test(msg)) return false;
  if (/^(what can|能做|可以幫|功能|features|capabilities|能協助)/.test(msg)) return false;
  if (msg.length < 5 && !/[a-z0-9]{3,}/i.test(msg)) return false;
  return true;
}

// ── Sidebar resize ─────────────────────────────────────────────────────────
(function initResize() {
  const sidebar = document.getElementById('sidebar');
  const handle = document.getElementById('sidebar-resize');
  let isResizing = false;
  const savedWidth = localStorage.getItem('sidebarWidth');
  if (savedWidth) sidebar.style.width = savedWidth + '%';
  handle.addEventListener('mousedown', e => { isResizing = true; e.preventDefault(); });
  document.addEventListener('mousemove', e => {
    if (!isResizing) return;
    const vw = window.innerWidth;
    const min = vw * 0.15, max = vw * 0.45;
    if (e.clientX >= min && e.clientX <= max) {
      const pct = (e.clientX / vw) * 100;
      sidebar.style.width = pct + '%';
      localStorage.setItem('sidebarWidth', pct.toString());
    }
  });
  document.addEventListener('mouseup', () => isResizing = false);
})();

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

// ── Session helpers ────────────────────────────────────────────────────────
function uuid() {
  return crypto.randomUUID ? crypto.randomUUID()
    : 'xxxx-xxxx-4xxx-yxxx'.replace(/[xy]/g, c => {
        const r = Math.random()*16|0; return (c==='x' ? r : (r&0x3|0x8)).toString(16);
      });
}
function newSession() {
  sessionId = uuid();
  titledThisSession = false;
  localStorage.setItem('fit_session', sessionId);
  clearMessages();
  document.getElementById('topbar-title').textContent = '新對話';
  loadSessions();
}
function loadSession(sid) {
  sessionId = sid;
  titledThisSession = true;  // 既存對話不再自動命名
  localStorage.setItem('fit_session', sid);
  clearMessages();
  fetch(`/api/history/${encodeURIComponent(sid)}`)
    .then(r => r.json())
    .then(msgs => {
      msgs.forEach(m => appendMessage(m.role, m.content, m.sources || [], false, { id: m.id, rating: m.rating }));
      fetch(`/api/sessions`).then(r => r.json()).then(sessions => {
        const s = sessions.find(s => s.session_id === sid);
        if (s && s.title && s.title !== '新對話') {
          document.getElementById('topbar-title').textContent = s.title;
        } else if (msgs.length) {
          const first = msgs.find(m => m.role === 'user');
          if (first) document.getElementById('topbar-title').textContent = first.content.slice(0, 40);
        }
      });
      scrollBottom();
    });
  loadSessions();
}

// ── Init ───────────────────────────────────────────────────────────────────
(function init() {
  const saved = localStorage.getItem('fit_session');
  if (saved) {
    fetch(`/api/history/${encodeURIComponent(saved)}`)
      .then(r => r.json())
      .then(msgs => {
        if (!msgs.length) { newSession(); return; }
        sessionId = saved;
        titledThisSession = true;
        msgs.forEach(m => appendMessage(m.role, m.content, m.sources || [], false, { id: m.id, rating: m.rating }));
        const first = msgs.find(m => m.role === 'user');
        if (first) document.getElementById('topbar-title').textContent = first.content.slice(0, 40);
        scrollBottom();
        loadSessions();
      })
      .catch(() => newSession());
  } else {
    newSession();
  }
  // restore draft
  const draft = localStorage.getItem('fit_draft');
  if (draft) { const ti = document.getElementById('user-input'); ti.value = draft; autoResize(ti); }
})();

// ── Session list ───────────────────────────────────────────────────────────
function loadSessions() {
  const q = document.getElementById('sess-search').value.trim();
  const url = q ? `/api/sessions/search?q=${encodeURIComponent(q)}` : '/api/sessions';
  fetch(url)
    .then(r => r.json())
    .then(sessions => {
      const list = document.getElementById('session-list');
      list.innerHTML = '';
      sessions.forEach(s => {
        const el = document.createElement('div');
        el.className = 'sess-item' + (s.session_id === sessionId ? ' active' : '');
        const at = s.last_at || s.updated_at || Date.now()/1000;
        const d = new Date(at * 1000);
        const displayTitle = (s.title && s.title !== '新對話') ? s.title : (s.first_msg || s.snippet || '(新對話)');
        const snippet = (q && s.snippet) ? `<div class="sess-snippet">${highlightHtml(s.snippet, q)}</div>` : '';
        const meta = s.msg_count != null
          ? `${d.getMonth()+1}/${d.getDate()} · ${s.msg_count} 則訊息`
          : `${d.getMonth()+1}/${d.getDate()} · ${s.hit_count||0} 個命中`;
        el.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div style="flex:1; cursor:pointer; min-width:0;" class="sess-click">
              <div class="sess-first">${escHtml(displayTitle)}</div>
              <div class="sess-meta">${meta}</div>
              ${snippet}
            </div>
            <div style="display:flex; gap:4px;" class="sess-actions">
              <button class="sess-btn edit-btn" title="編輯標題">✎</button>
              <button class="sess-btn delete-btn" title="刪除此對話">⊗</button>
            </div>
          </div>`;
        el.querySelector('.sess-click').onclick = () => loadSession(s.session_id);
        el.querySelector('.edit-btn').onclick = (e) => { e.stopPropagation(); renameSession(s.session_id, s.title); };
        el.querySelector('.delete-btn').onclick = (e) => { e.stopPropagation(); deleteSession(s.session_id); };
        list.appendChild(el);
      });
    });
}

let searchTimer = null;
document.getElementById('sess-search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadSessions, 250);
});

function highlightHtml(text, q) {
  if (!q) return escHtml(text);
  const safe = escHtml(text);
  const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(esc, 'gi'), m => `<mark class="hl">${m}</mark>`);
}

// ── Session actions ────────────────────────────────────────────────────────
function renameSession(sid, currentTitle) {
  const newTitle = prompt('編輯對話標題:', currentTitle || '');
  if (newTitle === null) return;
  const title = newTitle.trim() || '新對話';
  fetch(`/api/sessions/${encodeURIComponent(sid)}?title=${encodeURIComponent(title)}`, { method: 'PUT' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      if (sid === sessionId) document.getElementById('topbar-title').textContent = data.title;
      loadSessions();
    })
    .catch(e => alert('編輯失敗: ' + e.message));
}
function deleteSession(sid) {
  if (!confirm('確定要刪除此對話嗎？此操作無法復原。')) return;
  fetch(`/api/history/${encodeURIComponent(sid)}`, { method: 'DELETE' })
    .then(r => r.json())
    .then(() => {
      if (sid === sessionId) { sessionId = null; localStorage.removeItem('fit_session'); newSession(); }
      else loadSessions();
    })
    .catch(e => alert('刪除失敗: ' + e.message));
}

// ── Send message ───────────────────────────────────────────────────────────
async function sendMessage(textOverride) {
  if (isLoading) { stopGeneration(); return; }
  const input = document.getElementById('user-input');
  const text = (textOverride != null ? textOverride : input.value).trim();
  if (!text) return;
  if (!sessionId) newSession();

  isLoading = true;
  abortCtl = new AbortController();
  if (textOverride == null) { input.value = ''; localStorage.removeItem('fit_draft'); autoResize(input); }
  document.getElementById('user-input').focus();
  setSendButtonStop(true);
  hideEmpty();

  if (textOverride == null) appendMessage('user', text, [], true);
  lastUserMsgText = text;
  const typingEl = appendTyping();
  scrollBottom();

  const payload = {
    session_id: sessionId,
    message: text,
    use_rag: shouldUseRAG(text),
    top_k: parseInt(document.getElementById('filter-topk').value),
    category_filter: document.getElementById('filter-cat').value.trim() || null,
    date_from: document.getElementById('filter-from').value.trim() || null,
    date_to:   document.getElementById('filter-to').value.trim() || null,
  };
  lastSendPayload = { text, payload };

  const startedAt = performance.now();

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: abortCtl.signal,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || res.statusText);
    }
    typingEl.remove();
    const { bubble, sourcesContainer, metaContainer } = createStreamingBubble();
    scrollBottom();

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let accumulated = '';
    let sources = [];
    let assistantMsgId = null;

    outer: while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let event;
        try { event = JSON.parse(line.slice(6)); } catch { continue; }

        if (event.type === 'session') {
          sessionId = event.session_id;
          localStorage.setItem('fit_session', sessionId);
        } else if (event.type === 'token') {
          accumulated += event.text;
          bubble.textContent = accumulated;
          scrollBottom();
        } else if (event.type === 'sources') {
          sources = event.sources;
        } else if (event.type === 'done') {
          assistantMsgId = event.message_id || null;
          bubble.className = 'bubble md';
          bubble.innerHTML = renderMarkdown(accumulated);
          decorateCodeBlocks(bubble);
          if (sources.length > 0) sourcesContainer.innerHTML = buildSourcesHtml(sources);
          const elapsed = ((performance.now() - startedAt) / 1000).toFixed(1);
          metaContainer.innerHTML = renderMsgMeta({
            id: assistantMsgId,
            rating: null,
            stats: `${elapsed}s · ${sources.length} 篇來源`,
          });
          if (!titledThisSession) tryAutoTitle();
          const titleEl = document.getElementById('topbar-title');
          if (titleEl.textContent === '新對話') titleEl.textContent = text.slice(0, 40);
          loadSessions();
          scrollBottom();
          break outer;
        } else if (event.type === 'error') {
          bubble.parentElement.parentElement.remove();
          showErrorBanner(event.text, event.action_url, event.action_label, event.command);
          break outer;
        }
      }
    }
  } catch (e) {
    typingEl && typingEl.parentNode && typingEl.remove();
    if (e.name === 'AbortError') {
      toast('已停止生成');
    } else {
      showErrorBanner(e.message);
    }
  } finally {
    isLoading = false;
    abortCtl = null;
    setSendButtonStop(false);
    scrollBottom();
    input.focus();
  }
}

function stopGeneration() {
  if (abortCtl) abortCtl.abort();
}
function setSendButtonStop(stop) {
  const btn = document.getElementById('btn-send');
  btn.classList.toggle('stop', stop);
  btn.title = stop ? '停止生成' : '送出';
  document.getElementById('send-icon').style.display = stop ? 'none' : '';
  document.getElementById('stop-icon').style.display = stop ? '' : 'none';
}

function showErrorBanner(msg, actionUrl = null, actionLabel = null, command = null) {
  hideEmpty();
  const box = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ai';
  const safeActionUrl = actionUrl === 'https://microsoft.com/devicelogin' ? actionUrl : null;
  const commandHtml = command ? `<code class="err-command">${escHtml(command)}</code>` : '';
  const actionHtml = safeActionUrl
    ? `<a class="err-login-link" href="${safeActionUrl}" target="_blank" rel="noopener noreferrer">${escHtml(actionLabel || '開啟登入頁')}</a>`
    : '';
  wrap.innerHTML = `<div class="avatar ai">!</div>
    <div class="msg-body" style="max-width:80%">
      <div class="err-banner">
        <span class="err-content">
          <span>⚠️ ${escHtml(msg || '發生未知錯誤')}</span>
          ${commandHtml}
          ${actionHtml}
        </span>
        <button class="err-retry">重試</button>
      </div>
    </div>`;
  wrap.querySelector('.err-retry').onclick = () => {
    wrap.remove();
    if (lastSendPayload) sendMessage(lastSendPayload.text);
  };
  box.appendChild(wrap);
  scrollBottom();
}

async function tryAutoTitle() {
  if (!sessionId) return;
  titledThisSession = true;
  try {
    const r = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/auto-title`, { method: 'POST' });
    if (!r.ok) return;
    const data = await r.json();
    if (data.title) {
      document.getElementById('topbar-title').textContent = data.title;
      loadSessions();
    }
  } catch {}
}

// ── Streaming bubble ───────────────────────────────────────────────────────
function createStreamingBubble() {
  hideEmpty();
  const box = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ai';
  const body = document.createElement('div');
  body.className = 'msg-body';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.style.whiteSpace = 'pre-wrap';
  const sourcesContainer = document.createElement('div');
  const metaContainer = document.createElement('div');
  body.appendChild(bubble);
  body.appendChild(sourcesContainer);
  body.appendChild(metaContainer);
  wrap.innerHTML = '<div class="avatar ai">AI</div>';
  wrap.appendChild(body);
  box.appendChild(wrap);
  return { wrap, bubble, sourcesContainer, metaContainer };
}

// ── DOM helpers ────────────────────────────────────────────────────────────
function hideEmpty() { const e = document.getElementById('empty-state'); if (e) e.remove(); }
function clearMessages() {
  document.getElementById('messages').innerHTML =
    `<div id="empty-state"><div class="icon">💬</div><p>請輸入問題開始查詢 FIT 內部知識庫</p></div>`;
}
function appendTyping() {
  const box = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ai';
  wrap.innerHTML = `<div class="avatar ai">AI</div>
    <div class="typing-dot"><span></span><span></span><span></span></div>`;
  box.appendChild(wrap);
  return wrap;
}
function renderMarkdown(content) {
  let html = (typeof marked !== 'undefined')
    ? marked.parse(content, { breaks: true, gfm: true })
    : escHtml(content).replace(/\n/g, '<br>');
  return html.replace(/<script[\s\S]*?<\/script>/gi, '');
}
function decorateCodeBlocks(root) {
  root.querySelectorAll('pre code').forEach(code => {
    try { if (window.hljs) window.hljs.highlightElement(code); } catch {}
    const pre = code.parentElement;
    if (pre.querySelector('.code-copy-btn')) return;
    const btn = document.createElement('button');
    btn.className = 'code-copy-btn';
    btn.textContent = '複製';
    btn.onclick = () => {
      navigator.clipboard.writeText(code.innerText).then(() => {
        btn.textContent = '✓ 已複製';
        setTimeout(() => btn.textContent = '複製', 1200);
      });
    };
    pre.appendChild(btn);
  });
}
function renderMsgMeta({ id, rating, stats }) {
  const now = new Date();
  const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  const idAttr = id ? `data-msg-id="${id}"` : '';
  const upCls = rating === 1 ? 'active-up' : '';
  const downCls = rating === -1 ? 'active-down' : '';
  return `<div class="msg-meta">
    <span>${time}</span>
    <span class="msg-stats">${escHtml(stats || '')}</span>
    <span class="msg-actions">
      <button class="msg-action act-copy" title="複製">📋</button>
      <button class="msg-action act-regen" title="重新生成">↻</button>
      ${id ? `<button class="msg-action act-up ${upCls}" title="這個回答有幫助" ${idAttr}>👍</button>
              <button class="msg-action act-down ${downCls}" title="這個回答沒幫助" ${idAttr}>👎</button>` : ''}
    </span>
  </div>`;
}
function appendMessage(role, content, sources, animate, opts) {
  opts = opts || {};
  hideEmpty();
  const box = document.getElementById('messages');
  const isUser = role === 'user';
  const wrap = document.createElement('div');
  wrap.className = `msg-wrap ${isUser ? 'user' : 'ai'}`;
  if (opts.id) wrap.dataset.msgId = opts.id;
  const body = document.createElement('div');
  body.className = 'msg-body';
  const bubble = document.createElement('div');
  if (isUser) {
    bubble.className = 'bubble';
    bubble.textContent = content;
  } else {
    bubble.className = 'bubble md';
    bubble.innerHTML = renderMarkdown(content);
  }
  body.appendChild(bubble);
  if (!isUser && sources && sources.length) {
    const sc = document.createElement('div');
    sc.innerHTML = buildSourcesHtml(sources);
    body.appendChild(sc);
  }
  const metaEl = document.createElement('div');
  metaEl.innerHTML = isUser
    ? renderUserMeta()
    : renderMsgMeta({ id: opts.id || null, rating: opts.rating, stats: sources && sources.length ? `${sources.length} 篇來源` : '' });
  body.appendChild(metaEl);

  wrap.innerHTML = `<div class="avatar ${isUser ? 'user' : 'ai'}">${isUser ? '我' : 'AI'}</div>`;
  wrap.appendChild(body);
  box.appendChild(wrap);
  if (!isUser) decorateCodeBlocks(bubble);
}
function renderUserMeta() {
  const now = new Date();
  const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  return `<div class="msg-meta">
    <span class="msg-actions">
      <button class="msg-action act-copy" title="複製">📋</button>
    </span>
    <span>${time}</span>
  </div>`;
}
function scrollBottom() { const b = document.getElementById('messages'); b.scrollTop = b.scrollHeight; }
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Message action delegation ──────────────────────────────────────────────
document.getElementById('messages').addEventListener('click', async (e) => {
  const t = e.target.closest('.msg-action');
  if (t) {
    const wrap = t.closest('.msg-wrap');
    const bubble = wrap.querySelector('.bubble');
    if (t.classList.contains('act-copy')) {
      navigator.clipboard.writeText(bubble.innerText).then(() => toast('已複製'));
      return;
    }
    if (t.classList.contains('act-regen')) {
      if (!lastUserMsgText) return toast('沒有可重新生成的訊息');
      sendMessage(lastUserMsgText);
      return;
    }
    if (t.classList.contains('act-up') || t.classList.contains('act-down')) {
      const id = parseInt(t.dataset.msgId);
      const up = t.classList.contains('act-up');
      const wasActive = t.classList.contains(up ? 'active-up' : 'active-down');
      const rating = wasActive ? 0 : (up ? 1 : -1);
      try {
        const r = await fetch('/api/feedback', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message_id: id, rating }),
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        wrap.querySelectorAll('.act-up, .act-down').forEach(b =>
          b.classList.remove('active-up', 'active-down'));
        if (rating === 1) t.classList.add('active-up');
        if (rating === -1) t.classList.add('active-down');
        toast(rating === 0 ? '已取消' : (up ? '感謝回饋' : '已記錄，將改進'));
      } catch (err) { toast('回饋失敗: ' + err.message); }
      return;
    }
  }
  const src = e.target.closest('.source-item[data-doc-id]');
  if (src) openDocument(src.getAttribute('data-doc-id'));
});

// ── Sources rendering ──────────────────────────────────────────────────────
function buildSourcesHtml(sources) {
  if (!sources || !sources.length) return '';
  const items = sources.map(s => {
    const docId = s.doc_id || '';
    const subj  = escHtml(s.subject || '（無主旨）');
    const meta  = `${escHtml(s.date || '')} · ${escHtml(s.category || '')}`;
    const clickable = docId ? ` data-doc-id="${escHtml(docId)}"` : '';
    const hint = docId ? '<span class="src-hint">🔍 點擊查看</span>' : '';
    return `<div class="source-item"${clickable}>
      <strong>${subj}</strong>
      <span style="color:var(--muted)"> · ${meta}</span>
      ${hint}
    </div>`;
  }).join('');
  return `
    <div class="sources-toggle" onclick="this.nextElementSibling.classList.toggle('open'); this.textContent = this.nextElementSibling.classList.contains('open') ? '▲ 收起來源（${sources.length}）' : '▼ 查看來源（${sources.length}）'">
      ▼ 查看來源（${sources.length}）
    </div>
    <div class="sources-list">${items}</div>`;
}

// ── Document modal ─────────────────────────────────────────────────────────
async function openDocument(docId) {
  const backdrop = document.getElementById('doc-modal-backdrop');
  const titleEl  = document.getElementById('doc-modal-title');
  const metaEl   = document.getElementById('doc-modal-meta');
  const bodyEl   = document.getElementById('doc-modal-body');
  const kwEl     = document.getElementById('doc-modal-keywords');
  titleEl.textContent = '載入中…';
  metaEl.innerHTML = '';
  bodyEl.innerHTML = '<div id="doc-modal-loading">⏳ 正在讀取信件內容…</div>';
  kwEl.innerHTML = '';
  backdrop.classList.add('open');

  try {
    const r = await fetch(`/api/document/${encodeURIComponent(docId)}`);
    if (!r.ok) {
      const err = await r.json().catch(() => ({ detail: r.statusText }));
      throw new Error(err.detail || `HTTP ${r.status}`);
    }
    const doc = await r.json();
    titleEl.textContent = doc.subject || '（無主旨）';

    const metaParts = [];
    const push = (label, val) => val && metaParts.push(
      `<span class="meta-item"><span class="meta-label">${label}：</span>${escHtml(val)}</span>`);
    push('日期', doc.date);
    if (doc.event_date && doc.event_date !== doc.date) push('事件日期', doc.event_date);
    push('分類', doc.category);
    push('寄件人', doc.sender);
    push('收件人', doc.recipients);
    metaEl.innerHTML = metaParts.join('');

    // highlight content with keywords + last user msg tokens
    const tokens = new Set();
    (doc.keywords || []).slice(0, 20).forEach(k => k && tokens.add(k));
    if (lastUserMsgText) lastUserMsgText.split(/\s+/).filter(w => w.length >= 2).forEach(w => tokens.add(w));
    bodyEl.innerHTML = highlightMany(doc.content || '（此文件沒有內容）', [...tokens]);

    if (doc.keywords && doc.keywords.length) {
      kwEl.innerHTML = doc.keywords.slice(0, 30)
        .map(k => `<span class="kw">${escHtml(k)}</span>`).join('');
    }
  } catch (e) {
    titleEl.textContent = '讀取失敗';
    bodyEl.innerHTML = `<div id="doc-modal-error">⚠️ ${escHtml(e.message)}</div>`;
  }
}
function closeDocModal() { document.getElementById('doc-modal-backdrop').classList.remove('open'); }
function highlightMany(text, terms) {
  let html = escHtml(text);
  const sorted = [...new Set(terms.filter(Boolean))].sort((a, b) => b.length - a.length);
  for (const t of sorted) {
    if (!t || t.length < 2) continue;
    const esc = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    html = html.replace(new RegExp(esc, 'gi'), m => `<mark class="hl">${m}</mark>`);
  }
  return html;
}

// ── Help / shortcuts modal ─────────────────────────────────────────────────
function openHelp() { document.getElementById('help-modal-backdrop').classList.add('open'); }
function closeHelp() { document.getElementById('help-modal-backdrop').classList.remove('open'); }

// ── Export ─────────────────────────────────────────────────────────────────
function exportConversation(fmt) {
  if (!sessionId) return toast('無對話可匯出');
  fetch(`/api/history/${encodeURIComponent(sessionId)}`)
    .then(r => r.json())
    .then(msgs => {
      const title = document.getElementById('topbar-title').textContent || 'chat';
      const safeName = title.replace(/[\\/:*?"<>|]/g, '_');
      let blob, ext;
      if (fmt === 'json') {
        blob = new Blob([JSON.stringify({ session_id: sessionId, title, messages: msgs }, null, 2)],
          { type: 'application/json' });
        ext = 'json';
      } else {
        const lines = [`# ${title}\n`];
        msgs.forEach(m => {
          const role = m.role === 'user' ? '🧑 使用者' : '🤖 助理';
          lines.push(`## ${role}\n\n${m.content}\n`);
          if (m.sources && m.sources.length) {
            lines.push(`> 來源（${m.sources.length}）：`);
            m.sources.forEach(s => lines.push(`> - ${s.subject || '(無主旨)'} · ${s.date || ''} · ${s.category || ''}`));
            lines.push('');
          }
        });
        blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
        ext = 'md';
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${safeName}.${ext}`;
      a.click();
      URL.revokeObjectURL(a.href);
    });
}

// ── Input / shortcuts wiring ───────────────────────────────────────────────
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 200) + 'px';
}
const input = document.getElementById('user-input');
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
input.addEventListener('input', function() {
  autoResize(this);
  const len = this.value.length;
  document.getElementById('char-hint').textContent = len > 0 ? `${len} 字` : '';
  localStorage.setItem('fit_draft', this.value);
});
document.getElementById('btn-send').addEventListener('click', () => {
  if (isLoading) stopGeneration(); else sendMessage();
});
document.getElementById('btn-new').addEventListener('click', newSession);
document.getElementById('btn-clear').addEventListener('click', () => {
  if (!sessionId) return;
  if (!confirm('確定要清除目前對話記錄？')) return;
  fetch(`/api/history/${encodeURIComponent(sessionId)}`, { method: 'DELETE' })
    .then(() => { clearMessages(); newSession(); });
});
document.getElementById('btn-theme').addEventListener('click', toggleTheme);
document.getElementById('btn-help').addEventListener('click', openHelp);

const exportBtn = document.getElementById('btn-export');
const exportMenu = document.getElementById('export-menu');
exportBtn.addEventListener('click', e => { e.stopPropagation(); exportMenu.classList.toggle('open'); });
exportMenu.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
  exportMenu.classList.remove('open');
  exportConversation(b.dataset.fmt);
}));
document.addEventListener('click', () => exportMenu.classList.remove('open'));

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (isLoading) { stopGeneration(); return; }
    closeDocModal(); closeHelp();
  }
  if (e.ctrlKey && e.key === '/') { e.preventDefault(); newSession(); }
  if (e.ctrlKey && e.shiftKey && (e.key === 'L' || e.key === 'l')) { e.preventDefault(); toggleTheme(); }
  if (e.key === '?' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) { openHelp(); }
});
</script>
