services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # HTTP REST API
      - "6334:6334"   # gRPC (faster for Python client)
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: ./rag
    ports:
      - "8000:8000"
    env_file: rag/.env
    environment:
      # Override QDRANT_HOST so FastAPI reaches Qdrant via Docker service name
      - QDRANT_HOST=qdrant
    depends_on:
      - qdrant
    restart: unless-stopped

  mcp:
    build: ./rag
    command: ["python", "-m", "uvicorn", "mcp_server.server:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    env_file: rag/.env
    environment:
      - QDRANT_HOST=qdrant
    depends_on:
      - qdrant
    restart: unless-stopped
