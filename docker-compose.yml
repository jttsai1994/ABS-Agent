version: '3.9'

services:
  abs-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abs-agent
    ports:
      - "127.0.0.1:8080:8080"  # 僅本地存取，透過 Nginx 代理對外
    environment:
      # 不在此設定機密值；改用 env_file
      - CHAT_PROVIDER=foundry_agent
      - CHAT_DB_PATH=/data/chat.db
    env_file:
      - .env.prod  # 此檔案包含 Azure 認證與管理員帳密（不提交 Git）
    volumes:
      # SQLite 資料庫持久化（Docker volume）
      - abs-agent-data:/data
      # Service Principal 憑證（bind mount，唯讀）
      - ./certs/abs-agent-prod.pfx:/cert/abs-agent.pfx:ro
      # Agent 白名單（可選，用於即時更新）
      - ./chatbot/agents.json:/app/chatbot/agents.json:ro
    restart: unless-stopped
    networks:
      - internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Nginx 反向代理
  # 若主機已有獨立 Nginx，可刪除此服務，改為在主機 Nginx 設定代理
  nginx:
    image: nginx:latest
    container_name: abs-agent-nginx
    ports:
      - "0.0.0.0:443:443"  # HTTPS 對外
      - "0.0.0.0:80:80"    # HTTP 重導至 HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/nginx/tls/abs-agent.crt:/etc/nginx/tls/abs-agent.crt:ro
      - /etc/nginx/tls/abs-agent.key:/etc/nginx/tls/abs-agent.key:ro
    depends_on:
      - abs-agent
    networks:
      - internal
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  abs-agent-data:
    driver: local

networks:
  internal:
    driver: bridge
